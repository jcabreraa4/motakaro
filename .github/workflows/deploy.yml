name: Deploy

run-name: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message || github.workflow }}

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Deploy Vercel
  vercel:
    name: Deploy ${{ matrix.display }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admins
            display: Admins
            project: VERCEL_PROJECT_ID_ADMINS
          - app: clients
            display: Clients
            project: VERCEL_PROJECT_ID_CLIENTS
          - app: landing
            display: Landing
            project: VERCEL_PROJECT_ID_LANDING
          - app: eve-admins
            display: Eve Admins
            project: VERCEL_PROJECT_ID_EVE_ADMINS
          - app: eve-clients
            display: Eve Clients
            project: VERCEL_PROJECT_ID_EVE_CLIENTS
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Package Dependencies
        run: bun install --frozen-lockfile

      - name: Pull Env Variables
        run: bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Application
        run: bunx vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        run: bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # Deploy Convex
  convex:
    name: Deploy Convex
    needs: vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Package Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Convex
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --yes

  # Deploy Trigger
  trigger:
    name: Deploy Trigger
    needs: convex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Package Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Trigger
        working-directory: packages/trigger
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: bunx trigger.dev deploy
