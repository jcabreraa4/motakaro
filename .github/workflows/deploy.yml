name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Build Vercel
  build_vercel:
    name: Build Vercel (${{ matrix.app }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admins
            project: VERCEL_PROJECT_ID_ADMINS
          - app: clients
            project: VERCEL_PROJECT_ID_CLIENTS
          - app: landing
            project: VERCEL_PROJECT_ID_LANDING
          - app: ghosts
            project: VERCEL_PROJECT_ID_GHOSTS
          - app: chatbot
            project: VERCEL_PROJECT_ID_CHATBOT
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Pull Env Variables
        run: bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Application
        run: bunx vercel build --prod --token=$VERCEL_TOKEN

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: vercel-${{ matrix.app }}
          path: .vercel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Deploy Vercel
  deploy_vercel:
    name: Deploy Vercel (${{ matrix.app }})
    needs: build_vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admins
          - app: clients
          - app: landing
          - app: ghosts
          - app: chatbot
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: vercel-${{ matrix.app }}
          path: .vercel

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Deploy to Vercel
        run: bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # Deploy Convex
  deploy_convex:
    name: Deploy Convex
    needs: deploy_vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Convex
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --yes

  # Deploy Trigger
  deploy_trigger:
    name: Deploy Trigger
    needs: deploy_convex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Trigger
        working-directory: packages/trigger
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: bunx trigger.dev deploy
