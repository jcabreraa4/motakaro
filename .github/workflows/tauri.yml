name: Tauri

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/src-tauri/**'
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.4
  RUST_VERSION: 1.99.1

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: clients
            file: motakaro_amd64.deb
          - app: admins
            file: motakaro-admins_amd64.deb
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          bun install --frozen-lockfile

      - name: Build Application
        working-directory: apps/${{ matrix.app }}
        run: bunx tauri build

      - name: Upload To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apps/${{ matrix.app }}/src-tauri/target/release/bundle/deb/*.deb "${{ matrix.file }}"
          gh release upload desktop "${{ matrix.file }}" --clobber
